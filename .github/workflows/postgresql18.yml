name: PostgreSQL 18-updates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql18-release
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Zoek een nieuwe PostgreSQL 18-patch
        id: version
        run: |
          upstream=$(docker run --pull=always --rm postgres:18 postgres --version)
          candidate=$(bash scripts/patch-version.sh candidate "$upstream")
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

  verify:
    needs: detect
    if: needs.detect.outputs.candidate != '' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test een echte databaseverbinding en het behoud van data bij upgrade
        env:
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
        run: bash scripts/smoke-test.sh "$CANDIDATE"

  release:
    needs: [detect, verify]
    if: needs.detect.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Bied de geteste appversie aan in de Home Assistant-appwinkel
        env:
          CANDIDATE: ${{ needs.detect.outputs.candidate }}
        run: |
          bash scripts/patch-version.sh apply "$CANDIDATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postgresql18/Dockerfile postgresql18/config.yaml
          git commit -m "Update PostgreSQL to $CANDIDATE"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

  keep-schedule-active:
    needs: detect
    if: needs.detect.outputs.candidate == '' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Leg na 30 dagen vast dat de updatecontrole nog draait
        run: |
          last_commit=$(git log -1 --format=%ct)
          if (( $(date +%s) - last_commit >= 30 * 86400 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Record PostgreSQL 18 update check"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
